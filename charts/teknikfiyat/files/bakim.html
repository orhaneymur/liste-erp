<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070b14">
<title>Güncelleniyor — __FIRMA__</title>
<style>
  /* Sitenin koyu temasıyla aynı renkler (src/app/globals.css).
     Dış istek yok: yazı tipi sistemden, ikonlar satır içi. */
  :root {
    --zemin: #070b14;
    --yuzey: rgba(255, 255, 255, 0.034);
    --kenar: rgba(255, 255, 255, 0.085);
    --metin: #eaeff9;
    --metin-2: #98a5bd;
    --metin-3: #616e88;
    --mavi: #4f8bff;
    --mor: #9b6bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(60rem 30rem at 50% -10%, rgba(79, 139, 255, 0.16), transparent 70%),
      radial-gradient(40rem 24rem at 90% 110%, rgba(155, 107, 255, 0.10), transparent 70%),
      var(--zemin);
    color: var(--metin);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .kart {
    width: 100%;
    max-width: 30rem;
    padding: 40px 28px 32px;
    text-align: center;
    background: var(--yuzey);
    border: 1px solid var(--kenar);
    border-radius: 0.875rem;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .amblem {
    width: 56px; height: 56px;
    margin: 0 auto 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--mavi), var(--mor));
    box-shadow: 0 10px 30px -10px rgba(79, 139, 255, 0.6);
  }
  .amblem svg { width: 28px; height: 28px; color: #fff; animation: don 2.4s linear infinite; }
  @keyframes don { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .amblem svg { animation: none; } }
  .firma {
    margin: 0 0 6px;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--metin-3);
  }
  h1 { margin: 0 0 12px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  p.mesaj { margin: 0; font-size: 15px; line-height: 1.6; color: var(--metin-2); }
  .iletisim { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .wa {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    border-radius: 999px;
    background: #25d366; color: #04140a;
    font-weight: 600; font-size: 15px; text-decoration: none;
  }
  .wa:hover { filter: brightness(1.1); }
  .wa svg { width: 20px; height: 20px; }
  .tel { color: var(--metin-2); font-size: 14px; text-decoration: none; }
  .tel:hover { color: var(--metin); }
</style>
</head>
<body>
  <main class="kart">
    <div class="amblem" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </div>
    <p class="firma">__FIRMA__</p>
    <h1>__BASLIK__</h1>
    <p class="mesaj">__MESAJ__</p>
    __ILETISIM__
  </main>
</body>
</html>
