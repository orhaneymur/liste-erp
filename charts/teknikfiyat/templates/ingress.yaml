{{- if .Values.ingress.enabled -}}
{{- $host := include "teknikfiyat.host" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teknikfiyat-ingress
  labels:
    {{- include "teknikfiyat.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: teknikfiyat-tls
  {{- end }}
  rules:
    # Bu adres ERP'nin adresinden BAĞIMSIZDIR. Ziyaretçi ERP'nin varlığını
    # bilmez: fiyat sitesi ERP'yi küme içinden çağırır, dışarıdan değil.
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "teknikfiyat.name" . }}
                port:
                  number: 80
{{- end }}
